<section id="cookie-banner" class="cookie" role="region" aria-labelledby="cookie-title" hidden>
  <p id="cookie-title" class="cookie__title" tabindex="-1" data-cookie-title>Cookies e privacidade</p>
  <p class="cookie__text">
    Usamos armazenamento essencial para o carrinho e para lembrar sua escolha. Cookies analíticos (Google Analytics 4) só são ativados se você permitir. Detalhes na <a href="/privacidade.html#cookies">Política de Privacidade</a>.
  </p>
  <div class="cookie__panel" data-cookie-panel hidden>
    <div class="check">
      <input type="checkbox" id="cookie-essential" checked disabled>
      <label for="cookie-essential">Essenciais: carrinho e preferência de cookies. Sempre ativos.</label>
    </div>
    <div class="check">
      <input type="checkbox" id="cookie-analytics" data-cookie-analytics>
      <label for="cookie-analytics">Analíticos: estatísticas de uso do site (Google Analytics 4).</label>
    </div>
    <button type="button" class="btn btn--primary btn--sm" data-cookie-save>Salvar preferências</button>
  </div>
  <div class="cookie__actions">
    <button type="button" class="btn btn--primary btn--sm" data-cookie-accept>Aceitar todos</button>
    <button type="button" class="btn btn--secondary btn--sm" data-cookie-reject>Rejeitar analíticos</button>
    <button type="button" class="btn btn--ghost btn--sm" data-cookie-customize aria-expanded="false">Personalizar</button>
  </div>
</section>
